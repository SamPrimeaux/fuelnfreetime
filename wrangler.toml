name = "fuelnfreetime"
main = "apps/ecommerce-cms-agentsam/backend/index.js"
compatibility_date = "2026-01-20"
compatibility_flags = ["nodejs_compat"]
# Custom domains are active; Workers.dev hostname is not used for OAuth/webhooks.
workers_dev = false

# @jsquash ships .wasm codecs used by the asset job Worker processor.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[observability.logs]
enabled = true
invocation_logs = true

# Deployment / security policy only.
# Runtime brand → D1 company. Installed integrations → D1 agentsam_plugins.
# Mail From → mail_settings. GitHub repo → agentsam_plugins. Completeful URL → agentsam_plugins.
[vars]
ALLOWED_ORIGINS = "https://fuelnfreetime.com,https://www.fuelnfreetime.com"
FNF_GITHUB_CLIENT_ID = "Ov23li6BZYxjVtGUWibX"
COMPLETEFUL_ALLOW_LIVE_WRITES = "true"
CLOUDFLARE_ACCOUNT_ID = "ede6590ac0d2fb7daf155b35653457b2"

[[routes]]
pattern = "fuelnfreetime.com"
custom_domain = true

[[routes]]
pattern = "www.fuelnfreetime.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "fuelnfreetime"
database_id = "9fd6ff92-e407-4b51-8b01-3c93f3845bb2"

[ai]
binding = "AGENTSAM_WAI"

[[r2_buckets]]
binding = "WEBSITE_ASSETS"
bucket_name = "fuelnfreetime"

[[kv_namespaces]]
binding = "CMS_CACHE"
id = "bc3b4e3f272e4b46b3c92df6dff85bff"

[[vectorize]]
binding = "FNF_VECTORIZE"
index_name = "fnf-agentsam-bge-m3-1024"

[[queues.producers]]
binding = "ASSET_JOBS"
queue = "fnf-asset-jobs"

[[queues.consumers]]
queue = "fnf-asset-jobs"
max_batch_size = 5
max_retries = 5
max_batch_timeout = 10

[[migrations]]
tag = "v1-cms-editor"
new_sqlite_classes = ["CmsEditorRoom"]

[[migrations]]
tag = "v2-remove-cms-editor"
deleted_classes = ["CmsEditorRoom"]

[triggers]
# Daily AgentSam compaction + hourly stale asset-job recovery (Queue is primary)
crons = ["0 4 * * *", "0 * * * *"]

[assets]
directory = "./dist/assets"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "404-page"
run_worker_first = true
