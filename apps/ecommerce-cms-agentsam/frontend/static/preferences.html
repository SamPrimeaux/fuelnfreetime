<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preferences — Fuel & Free Time Admin</title>
<link rel="stylesheet" href="/admin/css/admin.css">
<link rel="stylesheet" href="/admin/css/console.css">
<link rel="stylesheet" href="/admin/css/preferences.css">
</head>
<body>
<script src="/admin/js/shell.js"></script>
<script>
let settings = {};
let navItems = [];
let dirty = false;
let domain = "fuelnfreetime.com";

renderShell("/admin/preferences", `
  <div class="prefs-hub">
    <div class="prefs-head">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9 5 5h14l1 4M4 9h16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM5.5 13V20h13v-7" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <h1>Online Store</h1>
    </div>
    <div class="prefs-crumb">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>›</span>
      <span>Preferences</span>
    </div>

    <section class="prefs-card">
      <h2>Store access</h2>
      <div class="prefs-row">
        <div class="prefs-row-copy">
          <svg class="prefs-row-icon" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6"/></svg>
          <div>
            <div class="prefs-row-title">Password protection</div>
            <div class="prefs-row-desc">Restrict access to visitors with the password.</div>
            <div class="prefs-password-field" id="password-field" hidden>
              <div class="prefs-field">
                <label for="store-password">Store password</label>
                <input type="password" id="store-password" autocomplete="new-password" placeholder="Enter a storefront password">
              </div>
            </div>
          </div>
        </div>
        <label class="prefs-switch"><input type="checkbox" id="password-protection" data-pref="passwordProtection"><span class="prefs-switch-slider"></span></label>
      </div>
      <div class="prefs-row">
        <div class="prefs-row-copy">
          <svg class="prefs-row-icon" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="1.6"/></svg>
          <div>
            <div class="prefs-row-title">Restrict access to B2B customers only</div>
            <div class="prefs-row-desc">B2B customers will need to log in and verify their account to access your store. <a href="/admin/subscribers">Manage customers</a></div>
          </div>
        </div>
        <label class="prefs-switch"><input type="checkbox" id="b2b-only" data-pref="b2bOnly"><span class="prefs-switch-slider"></span></label>
      </div>
    </section>

    <section class="prefs-card">
      <h2>Search appearance and social sharing</h2><p>Set the page title and description search engines receive, and choose a real image from your media library. The preview is a guide, not a guarantee of how a platform displays your page.</p>
      <div class="prefs-seo-grid">
        <div class="prefs-social-preview">
          <img id="social-image" src="" alt="Chosen social sharing graphic" hidden><div class="prefs-social-placeholder" id="social-placeholder">Choose a sharing image to preview your store’s social card.</div>
          <div class="prefs-social-meta">
            <div class="prefs-social-domain" id="social-domain">FUELNFREETIME.COM</div>
            <div class="prefs-social-title" id="social-preview-title">Fuel &amp; Free Time</div>
            <div class="prefs-social-desc" id="social-preview-desc">Store description preview</div>
          </div>
        </div>
        <div>
          <div class="prefs-field">
            <label for="home-title">Home page title</label>
            <input type="text" id="home-title" maxlength="70" data-pref="homeTitle">
            <div class="prefs-counter"><span id="title-count">0</span> of 70 characters used</div>
          </div>
          <div class="prefs-field">
            <label for="meta-description">Meta description</label>
            <textarea id="meta-description" maxlength="320" data-pref="metaDescription" placeholder="Enter a description to be shown on search engines like Google"></textarea>
            <div class="prefs-counter"><span id="meta-count">0</span> of 320 characters used</div>
          </div>
          <div class="prefs-field">
            <label>Sharing image <span class="prefs-optional">Recommended 1200 × 630 px (1.91:1)</span></label>
            <div class="prefs-media-choice">
              <img id="social-asset-thumb" alt="" hidden>
              <div class="prefs-media-choice__info"><strong id="social-asset-name">No image selected</strong><span>Use an existing logo, cover artwork, or upload a new image.</span></div>
              <button type="button" class="btn ghost small" data-pick-asset="social">Choose image</button>
              <button type="button" class="btn ghost small" data-clear-asset="social" aria-label="Remove sharing image">Remove</button>
            </div>
            <input type="hidden" id="social-image-url" data-pref="socialImageUrl">
            <details class="prefs-advanced"><summary>Advanced image URL</summary><label for="social-image-url-advanced">Image address</label><input type="text" id="social-image-url-advanced" placeholder="/media/…" autocomplete="off"><p>Usually you won't need this. Use Choose image above.</p></details>
          </div>
        </div>
      </div>
    </section>

    <section class="prefs-card">
      <h2>Site navigation</h2>
      <p>Manage the pages visitors see in your header and footer. Choose your logo above, then rename, reorder or hide navigation links below.</p>
      <div class="prefs-seo-grid" style="grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
        <div class="prefs-field">
          <label>Storefront logo</label>
          <div class="prefs-media-choice prefs-media-choice--logo"><img id="nav-asset-thumb" alt="Storefront logo preview" hidden><div class="prefs-media-choice__info"><strong id="nav-asset-name">Use current logo</strong><span>PNG, SVG, WEBP or transparent artwork</span></div><button type="button" class="btn ghost small" data-pick-asset="nav">Choose logo</button><button type="button" class="btn ghost small" data-clear-asset="nav" aria-label="Remove custom logo">Remove</button></div>
          <input type="hidden" id="nav-logo-url">
          <details class="prefs-advanced"><summary>Advanced logo URL</summary><label for="nav-logo-url-advanced">Logo address</label><input type="text" id="nav-logo-url-advanced" placeholder="/media/…" autocomplete="off"></details>
        </div>
        <div class="prefs-field">
          <label for="nav-logo-height">Logo height (px)</label>
          <input type="number" id="nav-logo-height" min="40" max="120" step="1">
        </div>
        <div class="prefs-field">
          <label for="nav-brand-accent">Brand accent</label>
          <input type="color" id="nav-brand-accent" style="height:42px;padding:4px">
        </div>
        <div class="prefs-field">
          <label for="nav-brand-accent-light">Accent highlight</label>
          <input type="color" id="nav-brand-accent-light" style="height:42px;padding:4px">
        </div>
      </div>
      <div id="nav-items-root"></div>
      <button type="button" class="btn ghost small" id="nav-add-item" style="margin-top:.75rem">+ Add menu link</button>
    </section>

    <section class="prefs-card">
      <h2>Announcement banner</h2>
      <div class="prefs-row">
        <div class="prefs-row-copy"><div><div class="prefs-row-title">Show announcement</div><div class="prefs-row-desc">Use a calm fixed message or a seamless scrolling announcement. Preview the appearance before saving.</div></div></div>
        <label class="prefs-switch"><input type="checkbox" id="announcement-enabled"><span class="prefs-switch-slider"></span></label>
      </div>
      <div class="prefs-announcement-preview" id="announcement-preview" aria-label="Announcement preview"><span id="announcement-preview-copy">Your announcement will appear here</span></div>
      <div class="prefs-seo-grid prefs-seo-grid--equal">
        <div class="prefs-field"><label for="announcement-text">Announcement message</label><input type="text" id="announcement-text" maxlength="160" placeholder="Built in Lafayette · Fuel hard. Live free."></div>
        <div class="prefs-field"><label for="announcement-href">Where it links</label><input type="text" id="announcement-href" placeholder="/shop"></div>
        <div class="prefs-field"><label for="announcement-style">Display</label><select id="announcement-style"><option value="static">Simple banner</option><option value="marquee">Subtle scrolling marquee</option></select></div>
        <div class="prefs-field prefs-color-field"><label for="announcement-bg">Background color</label><input type="color" id="announcement-bg" value="#161616"></div>
        <div class="prefs-field prefs-color-field"><label for="announcement-color">Text color</label><input type="color" id="announcement-color" value="#ffffff"></div>
      </div>
    </section>

    <section class="prefs-card">
      <h2>Automatic redirection</h2>
      <div class="prefs-row">
        <div class="prefs-row-copy">
          <svg class="prefs-row-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/><path d="M4 12h16M12 4c2.5 2 2.5 14 0 16M12 4c-2.5 2-2.5 14 0 16" stroke="currentColor" stroke-width="1.4"/></svg>
          <div>
            <div class="prefs-row-title">Country/region</div>
            <div class="prefs-row-desc">Displays the storefront that matches a visitor's location.</div>
          </div>
        </div>
        <label class="prefs-switch"><input type="checkbox" id="geo-redirect" data-pref="geoRedirect"><span class="prefs-switch-slider"></span></label>
      </div>
      <div class="prefs-row">
        <div class="prefs-row-copy">
          <svg class="prefs-row-icon" viewBox="0 0 24 24" fill="none"><path d="m5 8 7-3 7 3v8l-7 3-7-3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 5v14M5 8l7 3 7-3" stroke="currentColor" stroke-width="1.6"/></svg>
          <div>
            <div class="prefs-row-title">Language</div>
            <div class="prefs-row-desc">Displays the language that matches a visitor's browser, when available.</div>
          </div>
        </div>
        <label class="prefs-switch"><input type="checkbox" id="language-redirect" data-pref="languageRedirect"><span class="prefs-switch-slider"></span></label>
      </div>
    </section>

    <section class="prefs-card">
      <h2>Spam protection</h2>
      <p>This screen currently stores protection preferences, but does not yet verify challenge responses. These options are not active security defenses until server-side verification is connected. <strong>Do not treat an enabled switch as protection.</strong></p><div class="prefs-warning">Status: verification integration required. Existing choices are shown for planning only.</div>
      <div class="prefs-row">
        <div class="prefs-row-copy">
          <svg class="prefs-row-icon" viewBox="0 0 24 24" fill="none"><path d="M4 6h16v12H4z" stroke="currentColor" stroke-width="1.6"/><path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.6"/></svg>
          <div>
            <div class="prefs-row-title">Enable on contact and comment forms</div>
          </div>
        </div>
        <label class="prefs-switch"><input type="checkbox" id="hcaptcha-contact" data-pref="hcaptchaContact"><span class="prefs-switch-slider"></span></label>
      </div>
      <div class="prefs-row">
        <div class="prefs-row-copy">
          <svg class="prefs-row-icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c0-3.3 3.1-6 7-6s7 2.7 7 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <div>
            <div class="prefs-row-title">Enable on login, create account and password recovery pages</div>
          </div>
        </div>
        <label class="prefs-switch"><input type="checkbox" id="hcaptcha-account" data-pref="hcaptchaAccount"><span class="prefs-switch-slider"></span></label>
      </div>
    </section>

    <section class="prefs-card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;">
        <div>
          <h2 style="margin-bottom:6px;">Crawler access</h2><p style="margin:0;">Crawler authorization is not enabled. The signature request and verification service have not been implemented yet. This will require short-lived credentials, signed requests, scope limits and audit logs before merchants can issue access.</p>
        </div>
        <span class="prefs-status-pill">Not configured</span>
      </div>
      <div class="prefs-tabs" role="tablist">
        <button type="button" class="prefs-tab is-active" data-tab="all">All</button>
        <button type="button" class="prefs-tab" data-tab="active">Active</button>
        <button type="button" class="prefs-tab" data-tab="expired">Expired</button>
      </div>
      <div class="prefs-empty" id="crawler-empty">No crawler credentials issued. This feature is not active.</div>
    </section>

    <div class="prefs-note" id="prefs-note"></div>
  </div>
  <dialog class="prefs-assets-dialog" id="prefs-assets-dialog" aria-labelledby="prefs-assets-title">
    <div class="prefs-assets-header"><div><small>FNF media library</small><h2 id="prefs-assets-title">Choose an image</h2></div><button type="button" id="prefs-assets-close" class="btn ghost small" aria-label="Close media library">Close</button></div>
    <div class="prefs-assets-tools"><input type="search" id="prefs-assets-search" placeholder="Search uploaded graphics, logos, and artwork" aria-label="Search media"><label class="btn ghost small prefs-upload-button">Upload new image<input type="file" id="prefs-assets-upload" accept="image/*" multiple hidden></label></div>
    <div class="prefs-assets-grid" id="prefs-assets-grid" role="list"></div>
    <p class="prefs-assets-status" id="prefs-assets-status" role="status"></p>
  </dialog>

  <footer class="prefs-savebar">
    <button type="button" class="btn primary" id="save-prefs-btn" disabled>Save</button>
  </footer>
`);

function setDirty(next = true) {
  dirty = next;
  document.getElementById("save-prefs-btn").disabled = !dirty;
  syncDockEdit();
}

/** Mirrors the fixed save bar into the mobile dock (admin-dock edit mode). */
function syncDockEdit(saving = false) {
  window.publishDockEdit?.({
    active: true,
    hint: saving ? "Saving…" : dirty ? "Unsaved changes" : "All changes saved",
    dirty,
    canSave: dirty && !saving,
    saveLabel: saving ? "Saving…" : "Save",
    onSave: () => document.getElementById("save-prefs-btn")?.click(),
  });
}

function showNote(msg, kind) {
  const el = document.getElementById("prefs-note");
  if (!msg) {
    el.className = "prefs-note";
    el.textContent = "";
    return;
  }
  el.className = `prefs-note is-visible is-${kind || "success"}`;
  el.textContent = msg;
}

function updateCounters() {
  const title = document.getElementById("home-title").value;
  const meta = document.getElementById("meta-description").value;
  document.getElementById("title-count").textContent = title.length;
  document.getElementById("meta-count").textContent = meta.length;
  document.getElementById("social-preview-title").textContent = title || domain;
  document.getElementById("social-preview-desc").textContent =
    meta || "Enter a description to be shown on search engines like Google.";
}

function setChosenAsset(kind, url, { notify = true } = {}) {
  const input = document.getElementById(kind === "nav" ? "nav-logo-url" : "social-image-url");
  const preview = document.getElementById(kind === "nav" ? "nav-asset-thumb" : "social-asset-thumb");
  const name = document.getElementById(kind === "nav" ? "nav-asset-name" : "social-asset-name");
  const advanced = document.getElementById(kind === "nav" ? "nav-logo-url-advanced" : "social-image-url-advanced");
  input.value = url || "";
  advanced.value = url || "";
  preview.hidden = !url;
  if (url) preview.src = url;
  else preview.removeAttribute("src");
  name.textContent = url ? decodeURIComponent(url.split("/").pop().split("?")[0] || "Selected asset") :
    (kind === "nav" ? "Use current logo" : "No image selected");
  if (kind === "social") updateSocialImage();
  if (notify) setDirty(true);
}

function updateSocialImage() {
  const url = document.getElementById("social-image-url").value.trim();
  const img = document.getElementById("social-image");
  img.hidden = !url;
  document.getElementById("social-placeholder").hidden = !!url;
  if (url) img.src = url;
  else img.removeAttribute("src");
}

function updateAnnouncementPreview() {
  const element = document.getElementById("announcement-preview");
  const value = document.getElementById("announcement-text").value.trim() || "Your announcement will appear here";
  const marquee = document.getElementById("announcement-style").value === "marquee";
  element.style.backgroundColor = document.getElementById("announcement-bg").value;
  element.style.color = document.getElementById("announcement-color").value;
  element.dataset.style = marquee ? "marquee" : "static";
  element.replaceChildren();
  const track = document.createElement("span");
  track.className = "prefs-announcement-preview__track";
  for (let i = 0; i < (marquee ? 4 : 1); i++) {
    const segment = document.createElement("span");
    segment.textContent = value;
    track.appendChild(segment);
  }
  element.appendChild(track);
}

function togglePasswordField() {
  const on = document.getElementById("password-protection").checked;
  document.getElementById("password-field").hidden = !on;
}

function escapeAttr(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll('"', "&quot;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

function renderNavItems() {
  const root = document.getElementById("nav-items-root");
  if (!root) return;
  root.innerHTML = navItems
    .map(
      (item, idx) => `
    <div class="prefs-nav-row" data-idx="${idx}" data-id="${escapeAttr(item.id || `nav-${idx}`)}">
      <div class="prefs-field" style="margin:0">
        <label>Label</label>
        <input type="text" class="nav-label" value="${escapeAttr(item.label)}" maxlength="40">
      </div>
      <div class="prefs-field" style="margin:0">
        <label>Destination</label>
        <input type="text" class="nav-href" value="${escapeAttr(item.href)}" placeholder="/about">
      </div>
      <details class="prefs-nav-advanced"><summary>Advanced: active menu paths</summary><label>Additional matching paths</label><input type="text" class="nav-prefixes" value="${escapeAttr((item.matchPrefixes || []).join(", "))}" placeholder="/about"><span>Only needed when several URLs share one navigation item.</span></details>
      <label class="prefs-switch" title="Visible in menu" style="margin-bottom:.35rem"><input type="checkbox" class="nav-visible" ${item.visible !== false ? "checked" : ""}><span class="prefs-switch-slider"></span></label>
      <div class="prefs-nav-actions"><button type="button" class="btn ghost small nav-up" aria-label="Move up" ${idx === 0 ? "disabled" : ""}>↑</button><button type="button" class="btn ghost small nav-down" aria-label="Move down" ${idx === navItems.length - 1 ? "disabled" : ""}>↓</button><button type="button" class="btn ghost small nav-remove" aria-label="Remove">×</button></div>
    </div>`
    )
    .join("");

  root.querySelectorAll(".nav-label, .nav-href, .nav-prefixes, .nav-visible").forEach((el) => {
    el.addEventListener("input", () => setDirty(true));
    el.addEventListener("change", () => setDirty(true));
  });
  root.querySelectorAll(".nav-remove").forEach((btn) => {
    btn.addEventListener("click", () => {
      const idx = Number(btn.closest(".prefs-nav-row").dataset.idx);
      navItems.splice(idx, 1);
      renderNavItems();
      setDirty(true);
    });
  });
  root.querySelectorAll(".nav-up, .nav-down").forEach((btn) => {
    btn.addEventListener("click", () => {
      const idx = Number(btn.closest(".prefs-nav-row").dataset.idx);
      const nextIdx = btn.classList.contains("nav-up") ? idx - 1 : idx + 1;
      if (nextIdx < 0 || nextIdx >= navItems.length) return;
      [navItems[idx], navItems[nextIdx]] = [navItems[nextIdx], navItems[idx]];
      renderNavItems();
      setDirty(true);
    });
  });
}

function collectNavItemsFromDom() {
  return Array.from(document.querySelectorAll(".prefs-nav-row")).map((row) => ({
    id: row.dataset.id || `nav-${row.dataset.idx}`,
    label: row.querySelector(".nav-label")?.value.trim() || "",
    href: row.querySelector(".nav-href")?.value.trim() || "",
    matchPrefixes: (row.querySelector(".nav-prefixes")?.value || "")
      .split(",")
      .map((s) => s.trim())
      .filter(Boolean),
    visible: row.querySelector(".nav-visible")?.checked !== false,
  }));
}

function applySettings(data) {
  settings = data.settings || {};
  domain = data.domain || domain;
  navItems = (data.nav?.items || settings.navItems || []).map((item) => ({ ...item }));
  document.getElementById("social-domain").textContent = domain.toUpperCase();

  document.getElementById("password-protection").checked = !!settings.passwordProtection;
  document.getElementById("b2b-only").checked = !!settings.b2bOnly;
  document.getElementById("geo-redirect").checked = !!settings.geoRedirect;
  document.getElementById("language-redirect").checked = !!settings.languageRedirect;
  document.getElementById("hcaptcha-contact").checked = !!settings.hcaptchaContact;
  document.getElementById("hcaptcha-account").checked = !!settings.hcaptchaAccount;

  document.getElementById("home-title").value = settings.homeTitle || "";
  document.getElementById("meta-description").value = settings.metaDescription || "";
  setChosenAsset("social", settings.socialImageUrl || "", { notify: false });
  document.getElementById("store-password").value = settings.storePassword || "";

  setChosenAsset("nav", settings.navLogoUrl || data.nav?.logoUrl || "", { notify: false });
  document.getElementById("nav-logo-height").value = data.nav?.logoHeight || settings.navLogoHeight || 68;
  document.getElementById("nav-brand-accent").value = data.nav?.brandAccent || settings.navBrandAccent || "#ff4500";
  document.getElementById("nav-brand-accent-light").value =
    data.nav?.brandAccentLight || settings.navBrandAccentLight || "#E5A558";
  document.getElementById("announcement-enabled").checked = data.nav?.announcement?.enabled === true;
  document.getElementById("announcement-text").value = data.nav?.announcement?.text || "";
  document.getElementById("announcement-href").value = settings.announcementHref || data.nav?.announcement?.href || "";
  document.getElementById("announcement-style").value = settings.announcementStyle === "marquee" ? "marquee" : "static";
  document.getElementById("announcement-bg").value = /^#[0-9a-f]{6}$/i.test(settings.announcementBgColor || "") ? settings.announcementBgColor : "#161616";
  document.getElementById("announcement-color").value = /^#[0-9a-f]{6}$/i.test(settings.announcementTextColor || "") ? settings.announcementTextColor : "#ffffff";
  updateAnnouncementPreview();

  renderNavItems();
  togglePasswordField();
  updateCounters();
  updateSocialImage();
  setDirty(false);
}

function collectSettings() {
  return {
    passwordProtection: document.getElementById("password-protection").checked,
    b2bOnly: document.getElementById("b2b-only").checked,
    geoRedirect: document.getElementById("geo-redirect").checked,
    languageRedirect: document.getElementById("language-redirect").checked,
    hcaptchaContact: document.getElementById("hcaptcha-contact").checked,
    hcaptchaAccount: document.getElementById("hcaptcha-account").checked,
    homeTitle: document.getElementById("home-title").value.trim(),
    metaDescription: document.getElementById("meta-description").value.trim(),
    socialImageUrl: document.getElementById("social-image-url").value.trim(),
    storePassword: document.getElementById("store-password").value,
    navLogoUrl: document.getElementById("nav-logo-url").value.trim(),
    navLogoHeight: Number(document.getElementById("nav-logo-height").value || 68),
    navBrandAccent: document.getElementById("nav-brand-accent").value,
    navBrandAccentLight: document.getElementById("nav-brand-accent-light").value,
    navItems: collectNavItemsFromDom(),
    announcementEnabled: document.getElementById("announcement-enabled").checked,
    announcementText: document.getElementById("announcement-text").value.trim(),
    announcementHref: document.getElementById("announcement-href").value.trim(),
    announcementStyle: document.getElementById("announcement-style").value,
    announcementBgColor: document.getElementById("announcement-bg").value,
    announcementTextColor: document.getElementById("announcement-color").value,
  };
}

document.getElementById("nav-add-item")?.addEventListener("click", () => {
  navItems.push({
    id: `nav-${Date.now()}`,
    label: "New page",
    href: "/",
    matchPrefixes: ["/"],
    visible: true,
  });
  renderNavItems();
  setDirty(true);
});

["nav-logo-url", "nav-logo-height", "nav-brand-accent", "nav-brand-accent-light"].forEach((id) => {
  document.getElementById(id)?.addEventListener("input", () => setDirty(true));
  document.getElementById(id)?.addEventListener("change", () => setDirty(true));
});

["announcement-enabled", "announcement-text", "announcement-href", "announcement-style", "announcement-bg", "announcement-color"].forEach((id) => {
  document.getElementById(id)?.addEventListener("input", () => { setDirty(true); updateAnnouncementPreview(); });
  document.getElementById(id)?.addEventListener("change", () => { setDirty(true); updateAnnouncementPreview(); });
});

document.querySelectorAll("[data-pref]").forEach((el) => {
  el.addEventListener("input", () => {
    setDirty(true);
    if (el.id === "home-title" || el.id === "meta-description") updateCounters();
    if (el.id === "social-image-url") updateSocialImage();
  });
  el.addEventListener("change", () => {
    setDirty(true);
    if (el.id === "password-protection") togglePasswordField();
  });
});

document.getElementById("save-prefs-btn").addEventListener("click", async () => {
  const btn = document.getElementById("save-prefs-btn");
  btn.disabled = true;
  syncDockEdit(true);
  try {
    const d = await adminFetch("/api/admin/store/preferences", {
      method: "POST",
      body: JSON.stringify({ settings: collectSettings() }),
    });
    applySettings(d);
    showNote("Preferences saved.", "success");
  } catch (err) {
    showNote(err.message, "error");
    setDirty(true);
  }
});

// Crawler and challenge verification need real server-side integration. No
// misleading 'create signature' action is exposed before the service exists.



const assetDialog = document.getElementById("prefs-assets-dialog");
let pickerKind = "social";
let availableAssets = [];

function showAssetStatus(message) {
  document.getElementById("prefs-assets-status").textContent = message || "";
}
function renderAvailableAssets(query = "") {
  const list = document.getElementById("prefs-assets-grid");
  const needle = query.trim().toLowerCase();
  const assets = availableAssets.filter((asset) =>
    String(asset.content_type || "").startsWith("image/") &&
    ((asset.filename || "") + " " + (asset.folder || "")).toLowerCase().includes(needle));
  list.replaceChildren();
  if (!assets.length) {
    const empty = document.createElement("p");
    empty.className = "prefs-assets-empty";
    empty.textContent = availableAssets.length ? "No matching images." : "No images in the library yet. Upload one to begin.";
    list.appendChild(empty);
    return;
  }
  for (const asset of assets) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "prefs-asset-tile";
    button.setAttribute("role", "listitem");
    const img = document.createElement("img");
    img.src = asset.url;
    img.loading = "lazy";
    img.alt = "";
    const label = document.createElement("span");
    label.textContent = asset.filename || "Uploaded asset";
    button.append(img, label);
    button.addEventListener("click", () => {
      setChosenAsset(pickerKind, asset.url);
      assetDialog.close();
    });
    list.append(button);
  }
}
async function loadAvailableAssets() {
  showAssetStatus("Loading your uploaded media…");
  const data = await adminFetch("/api/admin/media?limit=120");
  availableAssets = data.assets || data.items || [];
  renderAvailableAssets(document.getElementById("prefs-assets-search").value);
  showAssetStatus(availableAssets.length + " assets available.");
}
document.querySelectorAll("[data-pick-asset]").forEach((button) => button.addEventListener("click", async () => {
  pickerKind = button.dataset.pickAsset;
  document.getElementById("prefs-assets-title").textContent = pickerKind === "nav" ? "Choose a storefront logo" : "Choose a social sharing image";
  assetDialog.showModal();
  try { await loadAvailableAssets(); } catch (error) { showAssetStatus(error.message || "Unable to load media."); }
}));
document.getElementById("prefs-assets-close").addEventListener("click", () => assetDialog.close());
document.getElementById("prefs-assets-search").addEventListener("input", (event) => renderAvailableAssets(event.target.value));
document.querySelectorAll("[data-clear-asset]").forEach((button) => button.addEventListener("click", () => {
  setChosenAsset(button.dataset.clearAsset, "");
}));
["social", "nav"].forEach((kind) => {
  const id = kind === "social" ? "social-image-url-advanced" : "nav-logo-url-advanced";
  document.getElementById(id).addEventListener("change", (event) => {
    const value = event.target.value.trim();
    if (value && !value.startsWith("/") && !/^https:\/\//i.test(value)) {
      showNote("Image URL must be an internal path or an HTTPS address.", "error");
      return;
    }
    setChosenAsset(kind, value);
  });
});
document.getElementById("prefs-assets-upload").addEventListener("change", async (event) => {
  const files = Array.from(event.target.files || []);
  if (!files.length) return;
  if (files.some((file) => !file.type.startsWith("image/"))) {
    showAssetStatus("Please choose image files only."); return;
  }
  const form = new FormData();
  for (const file of files) form.append("files", file);
  form.append("prefix", "uploads/store-preferences/");
  showAssetStatus("Uploading your image…");
  try {
    const response = await fetch("/api/admin/media", { method: "POST", credentials: "include", body: form });
    if (!response.ok) throw new Error("Upload failed (" + response.status + ")");
    const data = await response.json();
    availableAssets = (data.assets || []).concat(availableAssets);
    renderAvailableAssets();
    showAssetStatus("Uploaded. Select the image to use it.");
  } catch (error) { showAssetStatus(error.message || "Upload failed."); }
  finally { event.target.value = ""; }
});
(async function () {
  try {
    const d = await adminFetch("/api/admin/store/preferences");
    applySettings(d);
  } catch (err) {
    showNote(err.message, "error");
  }
})();
</script>
