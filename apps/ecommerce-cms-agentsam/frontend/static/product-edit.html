<script>
const params = new URLSearchParams(location.search);
const productId = params.get("id");
const isNew = !productId;

let productSlug = "";
let dirty = false;
let saveInFlight = false;
let saveFailed = false;
let designContext = null;
let selectedCollectionIds = new Set();
let availableCollections = [];
let variantOriginals = new Map();
let variantCount = 0;
/** @type {{ id: number, url: string, filename?: string }[]} */
let pendingImages = [];

function slugify(text) {
  return String(text || "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "");
}

function setDirty(next) {
  dirty = Boolean(next);
  const hint = document.getElementById("save-hint");
  const btn = document.getElementById("save-btn");
  const discard = document.getElementById("discard-btn");
  if (hint) {
    hint.textContent = saveInFlight ? "Saving…" : saveFailed ? "Save failed" :
      dirty ? "Unsaved changes" :
      isNew ? "Enter product details" : "All changes saved";
    hint.classList.toggle("is-dirty", dirty);
    hint.classList.toggle("is-error", saveFailed);
    hint.setAttribute("role", "status");
  }
  if (btn) btn.disabled = !dirty || saveInFlight;
  if (discard) discard.disabled = !dirty || saveInFlight;
  const connect = document.getElementById("connect-fulfillment-btn");
  if (connect) {
    const design = designContext?.draft;
    connect.disabled = dirty || saveInFlight ||
      !(design?.original_media_asset_id || design?.prepared_media_asset_id) ||
      Number(document.getElementById("price")?.value || 0) <= 0;
  }
  syncDockEdit();
}

/** Mirrors the sticky save bar into the mobile dock (admin-dock edit mode). Harmless when no dock is mounted. */
function syncDockEdit() {
  const hint = document.getElementById("save-hint");
  const btn = document.getElementById("save-btn");
  const detail = {
    active: true,
    // Short strings: the dock is ~294px wide on a 390pt phone.
    hint: isNew && !dirty ? "New product" : hint ? hint.textContent : "",
    dirty,
    canSave: Boolean(btn) && !btn.disabled,
    saveLabel: saveInFlight ? "Saving…" : isNew ? "Create" : "Save",
    onSave: () => document.getElementById("save-btn")?.click(),
    discardHref: isNew ? "/admin/products" : location.pathname + location.search,
  };
  window.publishDockEdit?.(detail);
}

function imgNote(msg, kind) {
  const el = document.getElementById("img-note");
  if (!el) return;
  el.textContent = msg || "";
  el.className = "product-note" + (kind ? ` is-${kind}` : "");
  el.style.display = msg ? "block" : "none";
}

function showNote(msg, kind) {
  const el = document.getElementById("form-note");
  if (!el) return;
  el.textContent = msg || "";
  el.className = "product-note" + (kind ? ` is-${kind}` : "");
  el.style.display = msg ? "block" : "none";
  if (msg && kind === "error") {
    el.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}

function statusBadge(status) {
  const cls =
    status === "active"
      ? "product-status-badge--active"
      : status === "archived"
        ? "product-status-badge--archived"
        : "product-status-badge--draft";
  return `<span class="product-status-badge ${cls}" id="status-badge">${status || "draft"}</span>`;
}

function updateHeaderTitle(title) {
  const h1 = document.getElementById("crumb-title");
  if (h1) h1.textContent = title || (isNew ? "New product" : "Product");
  document.title = (title || "Product") + " — Fuel & Free Time Admin";
}

function updateSeoPreview() {
  const title = document.getElementById("title")?.value.trim() || "Product title";
  const slug = document.getElementById("slug")?.value.trim() || slugify(title) || "product";
  const description = document.getElementById("description")?.value.trim() || "";
  const price = Number(document.getElementById("price")?.value || 0);
  const seoTitle = document.getElementById("seo-title-input")?.value.trim() || "";
  const seoDescription = document.getElementById("seo-description-input")?.value.trim() || "";
  document.getElementById("seo-title").textContent = seoTitle || title;
  document.getElementById("seo-url").textContent = location.origin + "/products/" + slug;
  document.getElementById("seo-desc").textContent =
    (seoDescription || description || (Number.isFinite(price) ? "$" + price.toFixed(2) + " USD" : "Product details")).slice(0, 320);
  document.getElementById("seo-title-count").textContent = seoTitle.length + " / 180";
  document.getElementById("seo-description-count").textContent = seoDescription.length + " / 320";
}

function syncStatusUi() {
  const status = document.getElementById("status-sidebar")?.value || "draft";
  const badge = document.getElementById("status-badge");
  if (badge) {
    badge.textContent = status;
    badge.className =
      "product-status-badge " +
      (status === "active"
        ? "product-status-badge--active"
        : status === "archived"
          ? "product-status-badge--archived"
          : "product-status-badge--draft");
  }
  const viewBtn = document.getElementById("view-btn");
  if (viewBtn && productSlug && status === "active") {
    viewBtn.href = `/products/${productSlug}`;
    viewBtn.style.visibility = "visible";
  } else if (viewBtn) {
    viewBtn.href = "#";
    viewBtn.style.visibility = isNew ? "hidden" : "visible";
  }
}

document.body.classList.add("console-body-bleed");

function bindDirtyFields() {
  ["title", "description", "seo-title-input", "seo-description-input", "collection", "price", "slug", "status-sidebar"].forEach((id) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("input", () => {
      saveFailed = false;
      setDirty(true);
      updateSeoPreview();
      if (id === "status-sidebar") syncStatusUi();
    });
    el.addEventListener("change", () => {
      saveFailed = false;
      setDirty(true);
      updateSeoPreview();
      if (id === "status-sidebar") syncStatusUi();
    });
  });
  document.getElementById("title")?.addEventListener("input", () => {
    const slugEl = document.getElementById("slug");
    if (slugEl && !slugEl.dataset.manual) {
      slugEl.value = slugify(document.getElementById("title").value);
      updateSeoPreview();
    }
  });
  document.getElementById("slug")?.addEventListener("input", (e) => {
    e.target.dataset.manual = "1";
    updateSeoPreview();
  });
}

// ----- Media -----

function renderStagedGrid() {
  const grid = document.getElementById("staged-grid");
  if (!grid) return;
  if (!pendingImages.length) {
    grid.style.display = "none";
    grid.innerHTML = "";
    return;
  }
  grid.style.display = "grid";
  grid.innerHTML = pendingImages
    .map(
      (img, idx) => `
    <div class="product-media-staged-tile">
      <img src="${img.url}" alt="">
      <button type="button" data-staged-idx="${idx}" aria-label="Remove">×</button>
    </div>`
    )
    .join("");
  grid.querySelectorAll("[data-staged-idx]").forEach((btn) => {
    btn.addEventListener("click", () => {
      pendingImages.splice(Number(btn.dataset.stagedIdx), 1);
      renderStagedGrid();
      setDirty(true);
    });
  });
}

async function attachAssetsToProduct(assetIds) {
  for (const id of assetIds) {
    await adminFetch(`/api/admin/products/${productId}/images`, {
      method: "POST",
      body: JSON.stringify({ media_asset_id: id }),
    });
  }
}

async function openBrowseLibrary() {
  const picked = await openMediaPicker({
    title: "Attach product images",
    multi: true,
  });
  if (!picked?.length) return;

  if (isNew) {
    for (const a of picked) {
      if (!pendingImages.some((p) => p.id === a.id)) {
        pendingImages.push({ id: a.id, url: a.url, filename: a.filename });
      }
    }
    renderStagedGrid();
    setDirty(true);
    imgNote(`Added ${picked.length} image(s) — save product to attach.`, "success");
    return;
  }

  try {
    await attachAssetsToProduct(picked.map((a) => a.id));
    imgNote(`Attached ${picked.length} image(s).`, "success");
    loadImages();
  } catch (err) {
    imgNote(err.message, "error");
  }
}

function bindMediaToolbar() {
  document.getElementById("browse-library-btn")?.addEventListener("click", openBrowseLibrary);
  const fileInput = document.getElementById("file-input");
  document.getElementById("upload-images-btn")?.addEventListener("click", () => fileInput?.click());
  fileInput?.addEventListener("change", () => {
    if (fileInput.files?.length) uploadFiles(fileInput.files);
    fileInput.value = "";
  });
}

function renderMediaGrid(images) {
  const grid = document.getElementById("media-grid");
  if (!grid) return;

  if (isNew) {
    grid.innerHTML = pendingImages.length
      ? ""
      : `<div class="product-media-add" id="drop-zone" role="button" tabindex="0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Drop files to upload</span>
      <button type="button" class="product-media-browse-link" data-browse-drop>Browse library</button>
    </div>`;
    bindDropZone();
    return;
  }

  const tiles = (images || [])
    .map(
      (img) => `
    <div class="product-media-tile ${img.is_primary ? "is-primary" : ""}" data-asset-id="${img.id}">
      ${img.is_primary ? '<span class="primary-tag">Primary</span>' : ""}
      <img src="${img.url}" alt="${img.filename || ""}">
      <div class="tile-actions">
        ${img.is_primary ? "" : '<button type="button" class="btn ghost small set-primary-btn">Primary</button>'}
        <button type="button" class="btn danger small remove-btn">Remove</button>
      </div>
    </div>`
    )
    .join("");

  grid.innerHTML =
    tiles +
    `<div class="product-media-add" id="drop-zone" role="button" tabindex="0">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Drop files to upload</span>
      <button type="button" class="product-media-browse-link" data-browse-drop>Browse library</button>
    </div>`;

  grid.querySelectorAll(".product-media-tile").forEach((tile) => {
    const assetId = tile.dataset.assetId;
    tile.querySelector(".set-primary-btn")?.addEventListener("click", async () => {
      await adminFetch(`/api/admin/products/${productId}/images/${assetId}/primary`, { method: "POST" });
      loadImages();
    });
    tile.querySelector(".remove-btn")?.addEventListener("click", async () => {
      await adminFetch(`/api/admin/products/${productId}/images/${assetId}`, { method: "DELETE" });
      loadImages();
    });
  });

  bindDropZone();
}

function bindDropZone() {
  const dropZone = document.getElementById("drop-zone");
  if (!dropZone || dropZone.dataset.bound) return;
  dropZone.dataset.bound = "1";

  const openUpload = () => document.getElementById("file-input")?.click();

  dropZone.addEventListener("click", (e) => {
    if (e.target.closest("[data-browse-drop]")) return;
    openUpload();
  });

  dropZone.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      openUpload();
    }
  });

  dropZone.querySelector("[data-browse-drop]")?.addEventListener("click", (e) => {
    e.stopPropagation();
    openBrowseLibrary();
  });

  ["dragenter", "dragover"].forEach((evt) =>
    dropZone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropZone.classList.add("is-dragover");
    })
  );
  ["dragleave", "drop"].forEach((evt) =>
    dropZone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropZone.classList.remove("is-dragover");
      if (evt === "drop" && e.dataTransfer?.files?.length) uploadFiles(e.dataTransfer.files);
    })
  );
}

async function loadImages() {
  if (isNew) {
    renderStagedGrid();
    renderMediaGrid([]);
    return;
  }
  try {
    const d = await adminFetch(`/api/admin/products/${productId}/images`);
    renderMediaGrid(d.images);
  } catch (err) {
    document.getElementById("media-grid").innerHTML = `<p class="product-card-hint">${err.message}</p>`;
  }
}

async function uploadFiles(fileList) {
  const form = new FormData();
  for (const f of fileList) form.append("files", f);
  form.append("prefix", `products/${productSlug || slugify(document.getElementById("title")?.value || "misc")}/`);
  form.append("category", "product");
  form.append("folder", "products");

  try {
    const res = await fetch("/api/admin/media", {
      method: "POST",
      body: form,
      credentials: "include",
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Upload failed");

    if (isNew) {
      for (const asset of data.assets) {
        if (!pendingImages.some((p) => p.id === asset.id)) {
          pendingImages.push({ id: asset.id, url: asset.url, filename: asset.filename });
        }
      }
      renderStagedGrid();
      renderMediaGrid([]);
      setDirty(true);
      imgNote(`Uploaded ${data.assets.length} image(s) — save product to attach.`, "success");
      return;
    }

    await attachAssetsToProduct(data.assets.map((a) => a.id));
    imgNote(`Uploaded and attached ${data.assets.length} image(s).`, "success");
    loadImages();
  } catch (err) {
    imgNote(err.message, "error");
  }
}

// ----- Variants -----

function variantNote(msg, kind) {
  const el = document.getElementById("variant-note");
  if (!el) return;
  el.textContent = msg || "";
  el.className = "product-note" + (kind ? ` is-${kind}` : "");
  el.style.display = msg ? "block" : "none";
}

function renderInventory(variants) {
  const body = document.getElementById("inventory-body");
  if (!body) return;
  if (!variants.length) {
    body.innerHTML = '<tr><td colspan="4" class="pages-empty">No variants — inventory tracked when you add SKUs</td></tr>';
    return;
  }
  body.innerHTML = variants
    .map((v) => {
      const label = [v.size, v.color].filter(Boolean).join(" / ") || "Default";
      return `<tr>
        <td data-label="Location">Default</td>
        <td data-label="Variant">${label}</td>
        <td data-label="SKU">${v.sku}</td>
        <td data-label="Available">${v.inventory_qty}</td>
      </tr>`;
    })
    .join("");
}

function renderVariants(variants) {
  variantCount = variants.length;
  variantOriginals = new Map(variants.map((v) => [Number(v.id), {
    sku: v.sku || "", size: v.size || "", color: v.color || "",
    price_cents: v.price_cents == null ? null : Number(v.price_cents),
    inventory_qty: Number(v.inventory_qty || 0),
  }]));
  const empty = document.getElementById("variants-empty");
  const wrap = document.getElementById("variants-table-wrap");
  const form = document.getElementById("variant-form");
  const body = document.getElementById("variants-body");

  if (!variants.length) {
    empty.style.display = "block";
    wrap.style.display = "none";
    form.style.display = "none";
    renderInventory([]);
    return;
  }

  empty.style.display = "none";
  wrap.style.display = "block";
  form.style.display = "block";

  body.innerHTML = variants
    .map(
      (v) => `
    <tr data-id="${v.id}">
      <td data-label="SKU"><input class="v-sku" value="${v.sku}"></td>
      <td data-label="Size"><input class="v-size" value="${v.size || ""}"></td>
      <td data-label="Color"><input class="v-color" value="${v.color || ""}"></td>
      <td data-label="Price"><input class="v-price" type="number" step="0.01" value="${v.price_cents != null ? (v.price_cents / 100).toFixed(2) : ""}"></td>
      <td data-label="Qty"><input class="v-qty" type="number" value="${v.inventory_qty}"></td>
      <td class="v-actions">
        <button type="button" class="btn ghost small v-delete">Delete</button>
      </td>
    </tr>`
    )
    .join("");

  body.querySelectorAll("tr").forEach((row) => {
    const id = row.dataset.id;
    row.querySelectorAll(".v-sku, .v-size, .v-color, .v-price, .v-qty").forEach((input) => {
      input.addEventListener("input", () => {
        saveFailed = false;
        setDirty(true); // Top-right Save owns both product details and variant edits.
      });
    });
    row.querySelector(".v-delete").addEventListener("click", async () => {
      if (!confirm("Delete this variant?")) return;
      try {
        await adminFetch(`/api/admin/variants/${id}`, { method: "DELETE" });
        loadProduct();
      } catch (err) {
        variantNote(err.message, "error");
      }
    });
  });

  renderInventory(variants);
}

function renderCollections() {
  const container = document.getElementById("collections-list");
  if (!container) return;
  container.replaceChildren();
  if (!availableCollections.length) {
    const hint = document.createElement("p");
    hint.className = "product-card-hint";
    hint.textContent = "No collections yet. Create one below to organize products.";
    container.append(hint);
  }
  for (const collection of availableCollections) {
    const label = document.createElement("label");
    label.className = "product-collection-option";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = selectedCollectionIds.has(Number(collection.id));
    checkbox.disabled = isNew;
    checkbox.value = String(collection.id);
    checkbox.addEventListener("change", () => {
      if (checkbox.checked) selectedCollectionIds.add(Number(collection.id));
      else selectedCollectionIds.delete(Number(collection.id));
      saveFailed = false;
      setDirty(true);
    });
    const name = document.createElement("span");
    name.textContent = collection.title;
    const status = document.createElement("small");
    status.textContent = collection.status === "active" ? "Published" : "Draft";
    label.append(checkbox, name, status);
    container.append(label);
  }
  document.getElementById("new-collection-btn").disabled = isNew;
}

async function loadCollections() {
  try {
    const { collections } = await adminFetch("/api/admin/collections");
    availableCollections = collections || [];
    renderCollections();
  } catch (error) {
    const container = document.getElementById("collections-list");
    if (container) container.textContent = "Could not load collections: " + error.message;
  }
}

function renderStudioDesign(draft, fulfillment, source = null) {
  const card = document.getElementById("studio-design-card");
  const root = document.getElementById("studio-design-content");
  if (!card || !root) return;
  designContext = draft ? { draft, fulfillment } : null;
  card.hidden = isNew;
  root.replaceChildren();
  const sourceLabel = document.createElement("p");
  sourceLabel.className = "product-card-hint";
  sourceLabel.textContent = source?.kind === "connected_provider"
    ? "Supplier: Completeful · " + (source.sync_status || "not yet connected") +
      ". Product, variants, and storefront publishing remain in this editor."
    : "Source: Store-managed · local, manual, or independently sourced inventory. " +
      "Product, variants, and storefront publishing remain in this editor.";
  root.append(sourceLabel);
  if (!draft) {
    const guidance = document.createElement("p");
    guidance.className = "product-card-hint";
    guidance.textContent = "Use Media above to attach artwork. The product can be edited and published without a supplier connector.";
    root.append(guidance);
    return;
  }

  const text = document.createElement("p");
  text.className = "product-card-hint";
  text.textContent = "Design " + draft.state + " · local draft #" + draft.product_id +
    " · " + (draft.prepared_media_asset_id ? "prepared artwork available" :
      draft.original_media_asset_id ? "original artwork saved" : "no artwork selected");
  root.append(text);

  const actions = document.createElement("div");
  actions.className = "product-design-actions";
  const edit = document.createElement("a");
  edit.className = "btn ghost small";
  edit.textContent = "Edit design";
  edit.href = "/admin/products/create/" + encodeURIComponent(draft.completeful_catalog_product_id);
  actions.append(edit);

  const linkId = fulfillment?.completeful_store_product_id;
  if (linkId) {
    const attached = document.createElement("span");
    attached.className = "product-design-status";
    attached.textContent = "Completeful linked · " + linkId;
    actions.append(attached);
  } else {
    const connect = document.createElement("button");
    connect.type = "button";
    connect.className = "btn ghost small";
    connect.id = "connect-fulfillment-btn";
    connect.textContent = "Connect Completeful fulfillment";
    connect.title = "Requires saved retail price and original or prepared artwork. Does not publish.";
    connect.addEventListener("click", async () => {
      if (dirty || saveInFlight) {
        showNote("Save product details before connecting fulfillment.", "error");
        return;
      }
      connect.disabled = true;
      connect.textContent = "Connecting Completeful…";
      try {
        const result = await adminFetch(
          "/api/admin/product-studio/drafts/" + encodeURIComponent(draft.id) + "/create-product",
          { method: "POST" }
        );
        await loadProduct();
        showNote(result.already_linked ? "Completeful product already linked." :
          "Completeful product linked. Storefront product remains unpublished.", "success");
      } catch (error) {
        showNote(error.message || "Could not connect fulfillment", "error");
        connect.textContent = "Retry Completeful connection";
        connect.disabled = false;
      }
    });
    actions.append(connect);
  }
  root.append(actions);
  const guidance = document.createElement("p");
  guidance.className = "product-card-hint";
  guidance.textContent = "The creative draft is saved independently of your commercial details. " +
    (linkId ? "Review all variants and product media before activating the storefront listing." :
      "Set price and description, then connect fulfillment. Product stays a draft until you publish it.");
  root.append(guidance);
}

async function loadProduct() {
  if (isNew) {
    updateHeaderTitle("New product");
    updateSeoPreview();
    setDirty(false);
    loadImages();
    return;
  }

  try {
    const d = await adminFetch(`/api/admin/products/${productId}`);
    const p = d.product;
    document.getElementById("title").value = p.title;
    document.getElementById("slug").value = p.slug;
    document.getElementById("slug").dataset.manual = "1";
    productSlug = p.slug;
    document.getElementById("description").value = p.description || "";
    document.getElementById("seo-title-input").value = p.seo_title || "";
    document.getElementById("seo-description-input").value = p.seo_description || "";
    document.getElementById("collection").value = p.collection || "";
    document.getElementById("status-sidebar").value = p.status;
    document.getElementById("price").value = (p.price_cents / 100).toFixed(2);
    updateHeaderTitle(p.title);
    syncStatusUi();
    updateSeoPreview();
    renderVariants(d.variants);
    selectedCollectionIds = new Set((d.collection_ids || []).map(Number));
    renderCollections();
    renderStudioDesign(d.design_draft, d.fulfillment, d.source);
    loadImages();
    saveFailed = false;
    setDirty(false);

    const menuView = document.getElementById("menu-view");
    if (menuView && p.status === "active") menuView.href = `/products/${p.slug}`;
  } catch (err) {
    showNote(err.message, "error");
  }
}

function collectVariantChanges() {
  const changes = [];
  document.querySelectorAll("#variants-body tr[data-id]").forEach((row) => {
    const id = Number(row.dataset.id);
    const initial = variantOriginals.get(id);
    if (!initial) return;
    const rawPrice = row.querySelector(".v-price").value;
    const current = {
      sku: row.querySelector(".v-sku").value.trim(),
      size: row.querySelector(".v-size").value.trim(),
      color: row.querySelector(".v-color").value.trim(),
      price_cents: rawPrice ? Math.round(Number(rawPrice) * 100) : null,
      inventory_qty: Number(row.querySelector(".v-qty").value),
    };
    const patch = { id };
    for (const [key, value] of Object.entries(current)) {
      if (value !== initial[key]) patch[key] = value;
    }
    if (Object.keys(patch).length > 1) changes.push(patch);
  });
  return changes;
}

function updateVariantOriginals(changes) {
  for (const patch of changes) {
    const original = variantOriginals.get(Number(patch.id));
    if (original) Object.assign(original, patch);
  }
}

function collectPayload() {
  const priceVal = parseFloat(document.getElementById("price").value || "0");
  return {
    title: document.getElementById("title").value.trim(),
    slug: document.getElementById("slug").value.trim() || slugify(document.getElementById("title").value),
    description: document.getElementById("description").value.trim(),
    seo_title: document.getElementById("seo-title-input").value.trim(),
    seo_description: document.getElementById("seo-description-input").value.trim(),
    collection: document.getElementById("collection").value.trim(),
    collection_ids: [...selectedCollectionIds],
    variants: collectVariantChanges(),
    status: document.getElementById("status-sidebar").value,
    price_cents: Number.isFinite(priceVal) ? Math.round(priceVal * 100) : 0,
  };
}

async function saveProduct() {
  const payload = collectPayload();
  if (!payload.title) {
    showNote("Title is required.", "error");
    return;
  }

  if (payload.status === "active" && !isNew) {
    const issues = [];
    if (variantCount === 0) issues.push("Add at least one size variant so customers can purchase");
    if (payload.price_cents <= 0 && variantCount === 0) issues.push("Set a base price or variant pricing");
    if (issues.length) {
      const ok = confirm(
        "This product is active but not ready for checkout:\n\n• " +
          issues.join("\n• ") +
          "\n\nCustomers will see the product page but cannot add to cart. Save anyway?"
      );
      if (!ok) return;
    }
  }

  // Keep changes made during an in-flight save unsaved until they persist.
  const saveSnapshot = JSON.stringify(payload);
  saveFailed = false;
  saveInFlight = true;
  setDirty(dirty);
  document.getElementById("save-btn").textContent = "Saving…";
  syncDockEdit();

  try {
    if (isNew) {
      const d = await adminFetch("/api/admin/products", { method: "POST", body: JSON.stringify(payload) });
      const newId = d.id;
      if (pendingImages.length) {
        const results = await Promise.allSettled(
          pendingImages.map((p) =>
            adminFetch(`/api/admin/products/${newId}/images`, {
              method: "POST",
              body: JSON.stringify({ media_asset_id: p.id }),
            })
          )
        );
        const failed = results.filter((r) => r.status === "rejected").length;
        if (failed) {
          showNote(`Product created, but ${failed} image(s) failed to attach.`, "error");
        }
      }
      window.location.href = `/admin/product-edit?id=${newId}`;
      return;
    }
    await adminFetch("/api/admin/products/" + productId, { method: "PUT", body: JSON.stringify(payload) });
    // Do not report success on an optimistic UI update; verify persisted fields.
    const verified = await adminFetch("/api/admin/products/" + productId);
    const stored = verified.product;
    if (!stored ||
      String(stored.title || "") !== payload.title ||
      String(stored.slug || "") !== payload.slug ||
      String(stored.description || "") !== payload.description ||
      String(stored.seo_title || "") !== payload.seo_title ||
      String(stored.seo_description || "") !== payload.seo_description ||
      String(stored.collection || "") !== payload.collection ||
      JSON.stringify((verified.collection_ids || []).map(Number).sort((a,b)=>a-b)) !==
        JSON.stringify(payload.collection_ids.slice().sort((a,b)=>a-b)) ||
      !payload.variants.every((patch) => {
        const row = (verified.variants || []).find((variant) => Number(variant.id) === patch.id);
        return row && Object.entries(patch).every(([field, value]) =>
          field === "id" || (value == null ? row[field] == null :
            String(row[field] ?? "") === String(value)));
      }) ||
      Number(stored.price_cents) !== payload.price_cents ||
      String(stored.status) !== payload.status) {
      throw new Error("Save did not verify against the stored product. Check the fields and retry.");
    }
    productSlug = stored.slug;
    updateHeaderTitle(stored.title);
    updateSeoPreview();
    renderStudioDesign(verified.design_draft, verified.fulfillment, verified.source);
    const additionalEdits = JSON.stringify(collectPayload()) !== saveSnapshot;
    updateVariantOriginals(payload.variants);
    setDirty(additionalEdits);
    syncStatusUi();
    showNote(additionalEdits ? "Earlier changes saved; newer edits still need saving." :
      "Product saved and verified.", "success");
  } catch (err) {
    saveFailed = true;
    showNote(err.message, "error");
    setDirty(true);
  } finally {
    saveInFlight = false;
    document.getElementById("save-btn").textContent = isNew ? "Save product" : "Save";
    setDirty(dirty);
  }
}

document.getElementById("save-btn").addEventListener("click", saveProduct);
document.getElementById("discard-btn")?.addEventListener("click", async () => {
  if (!dirty || saveInFlight) return;
  if (!confirm("Discard unsaved changes and restore the last saved product details?")) return;
  saveFailed = false;
  if (isNew) {
    window.location.assign("/admin/products");
    return;
  }
  await loadProduct();
  showNote("Restored last saved product details.", "success");
});

document.getElementById("duplicate-btn")?.addEventListener("click", () => {
  alert("Duplicate product is coming soon.");
});

document.getElementById("more-btn")?.addEventListener("click", (e) => {
  e.stopPropagation();
  document.getElementById("more-menu").classList.toggle("is-open");
});
document.addEventListener("click", () => {
  document.getElementById("more-menu")?.classList.remove("is-open");
});

async function deleteProduct() {
  if (!confirm("Delete this product and all its variants? This cannot be undone.")) return;
  try {
    await adminFetch(`/api/admin/products/${productId}`, { method: "DELETE" });
    window.location.href = "/admin/products";
  } catch (err) {
    showNote(err.message, "error");
  }
}

document.getElementById("menu-delete")?.addEventListener("click", deleteProduct);

document.getElementById("show-variant-form")?.addEventListener("click", () => {
  document.getElementById("variants-empty").style.display = "none";
  document.getElementById("variant-form").style.display = "block";
});

document.getElementById("add-variant-btn")?.addEventListener("click", async () => {
  const sku = document.getElementById("new-sku").value.trim();
  if (!sku) {
    variantNote("SKU is required.", "error");
    return;
  }
  try {
    await adminFetch(`/api/admin/products/${productId}/variants`, {
      method: "POST",
      body: JSON.stringify({
        sku,
        size: document.getElementById("new-size").value.trim(),
        color: document.getElementById("new-color").value.trim(),
        price_cents: document.getElementById("new-price").value
          ? Math.round(parseFloat(document.getElementById("new-price").value) * 100)
          : null,
        inventory_qty: document.getElementById("new-qty").value || 0,
      }),
    });
    document.getElementById("new-sku").value = "";
    document.getElementById("new-size").value = "";
    document.getElementById("new-color").value = "";
    document.getElementById("new-price").value = "";
    document.getElementById("new-qty").value = "0";
    variantNote("Variant added.", "success");
    loadProduct();
  } catch (err) {
    variantNote(err.message, "error");
  }
});

document.getElementById("new-collection-btn")?.addEventListener("click", async () => {
  if (isNew) return;
  const input = document.getElementById("new-collection-name");
  const title = input.value.trim();
  if (!title) {
    showNote("Enter a collection name.", "error");
    return;
  }
  const button = document.getElementById("new-collection-btn");
  button.disabled = true;
  try {
    const { collection } = await adminFetch("/api/admin/collections", {
      method: "POST",
      body: JSON.stringify({
        title,
        status: document.getElementById("new-collection-status").value,
      }),
    });
    availableCollections.push(collection);
    selectedCollectionIds.add(Number(collection.id));
    input.value = "";
    saveFailed = false;
    renderCollections();
    setDirty(true);
    showNote("Collection created. Save product details to assign this product.", "success");
  } catch (error) {
    showNote(error.message || "Collection creation failed", "error");
  } finally {
    button.disabled = false;
  }
});

bindDirtyFields();
bindMediaToolbar();
loadCollections();
loadProduct();
</script>
</body>
