<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collections — Fuel & Free Time Admin</title>
<link rel="stylesheet" href="/admin/css/admin.css">
<link rel="stylesheet" href="/admin/css/console.css">
<link rel="stylesheet" href="/admin/css/collections.css">\n<link rel="stylesheet" href="/admin/css/media-picker.css">
</head>
<body>
<script src="/admin/js/shell.js"></script>\n<script src="/admin/js/media-picker.js"></script>
<script>
renderShell("/admin/collections", '<main class="fnf-collections" id="collections-manager"><header class="cm-toolbar"><div><p class="cm-kicker">Products / Merchandise</p><h1>Collections</h1><p>Create, curate and publish the collections customers shop.</p></div><div class="cm-header-actions"><a class="btn ghost" href="/admin/products">All products</a><button class="btn primary" id="cm-create" type="button">+ New collection</button></div></header><div id="cm-message" class="cm-message" role="status" aria-live="polite" hidden></div><div class="cm-layout"><aside class="cm-library" aria-label="Collections"><div class="cm-library-head"><label for="cm-search">Find a collection</label><input type="search" id="cm-search" placeholder="Search title or handle" autocomplete="off"><div class="cm-collection-count" id="cm-count"></div></div><div class="cm-library-items" id="cm-list" role="list"><p class="cm-muted">Loading collections…</p></div></aside><section class="cm-editor" aria-label="Collection editor"><div class="cm-empty" id="cm-empty"><h2>Select a collection</h2><p>Edit its storefront appearance, set publication status, and choose the products that belong in it.</p><button class="btn primary" type="button" id="cm-empty-create">Create collection</button></div><form id="cm-form" hidden><div class="cm-editor-head"><div><p class="cm-kicker" id="cm-mode">Edit collection</p><h2 id="cm-heading">Collection</h2><span id="cm-edited" class="cm-muted"></span></div><div class="cm-editor-actions"><a id="cm-preview" class="btn ghost" href="/shop/collections" target="_blank" rel="noopener">View storefront</a><button type="button" id="cm-reload" class="btn ghost">Discard edits</button><button type="submit" id="cm-save" class="btn primary">Save collection</button></div></div><div class="cm-fields"><label>Collection title<input id="cm-title" name="title" maxlength="120" required placeholder="Diesel Driven"></label><label>URL handle<input id="cm-slug" name="slug" maxlength="180" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" required placeholder="diesel-driven"></label><label>Publication<select id="cm-status" name="status"><option value="draft">Draft — hidden from storefront</option><option value="active">Published — visible to customers</option><option value="archived">Archived — hidden and retained</option></select></label><label>Order<input id="cm-sort" name="sort_order" type="number" min="0" max="100000" step="1" value="0"></label><label class="cm-wide">Description<textarea id="cm-description" name="description" rows="3" maxlength="6000" placeholder="Tell customers what connects these products"></textarea></label><label>Eyebrow / short label<input id="cm-eyebrow" maxlength="120" name="eyebrow" placeholder="Built for the long haul"></label><label>Accent color<input id="cm-accent" name="accent_color" type="color" value="#ff4d00"></label><label class="cm-wide">Collection image URL<input id="cm-image" name="image_url" maxlength="2000" placeholder="/assets/... or https://..." autocomplete="off"><span class="cm-image-actions"><button type="button" id="cm-browse-media" class="btn ghost">Browse media library</button><a href="/admin/content" target="_blank" rel="noopener">Open library</a></span><img id="cm-cover-preview" alt="Selected collection cover" hidden><small>Choose one image from the existing R2 library, or paste a direct image URL.</small></label><label>SEO page title<input id="cm-seo-title" name="seo_title" maxlength="180" placeholder="Optional custom search title"></label><label>SEO description<textarea id="cm-seo-description" name="seo_description" maxlength="400" rows="2" placeholder="Optional search description"></textarea></label></div><section class="cm-products-section"><div class="cm-products-head"><div><h3>Products in this collection <span id="cm-selected-count">0</span></h3><p class="cm-muted">Choose existing catalog items. Product publish status is managed separately.</p></div><button type="button" id="cm-save-members" class="btn primary">Save product assignments</button></div><div class="cm-product-tools"><label for="cm-product-search">Find products</label><input id="cm-product-search" type="search" placeholder="Search product title or handle"><label class="cm-check"><input type="checkbox" id="cm-selected-only"> Selected only</label></div><div id="cm-product-list" class="cm-product-list" role="group" aria-label="Assign products"><p class="cm-muted">Loading products…</p></div></section></form></section></div></main>');
</script>
<script defer src="/admin/js/collection-manager.js"></script>
</body>
</html>
