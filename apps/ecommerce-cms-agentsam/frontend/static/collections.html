<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collections — Fuel & Free Time Admin</title>
<link rel="stylesheet" href="/admin/css/admin.css">
<link rel="stylesheet" href="/admin/css/console.css">
<link rel="stylesheet" href="/admin/css/collections.css">\n<link rel="stylesheet" href="/admin/css/merch-hero.css">\n<link rel="stylesheet" href="/admin/css/media-picker.css">
</head>
<body>
<script src="/admin/js/shell.js"></script>\n<script src="/admin/js/media-picker.js"></script>
<script>
renderShell("/admin/collections", '<main class="fnf-collections" id="collections-manager"><header class="cm-toolbar"><div><p class="cm-kicker">Products / Merchandise</p><h1>Collections</h1><p>Create, curate and publish the collections customers shop.</p></div><div class="cm-header-actions"><a class="btn ghost" href="/admin/products">All products</a><button class="btn primary" id="cm-create" type="button">+ New collection</button></div></header><div id="cm-message" class="cm-message" role="status" aria-live="polite" hidden></div><div class="cm-layout"><aside class="cm-library" aria-label="Collections"><div class="cm-library-head"><label for="cm-search">Find a collection</label><input type="search" id="cm-search" placeholder="Search title or handle" autocomplete="off"><div class="cm-collection-count" id="cm-count"></div></div><div class="cm-library-items" id="cm-list" role="list"><p class="cm-muted">Loading collections…</p></div></aside><section class="cm-editor" aria-label="Collection editor"><div class="cm-empty" id="cm-empty"><h2>Select a collection</h2><p>Edit its storefront appearance, set publication status, and choose the products that belong in it.</p><button class="btn primary" type="button" id="cm-empty-create">Create collection</button></div><form id="cm-form" hidden><div class="cm-editor-head"><div><p class="cm-kicker" id="cm-mode">Edit collection</p><h2 id="cm-heading">Collection</h2><span id="cm-edited" class="cm-muted"></span></div><div class="cm-editor-actions"><a id="cm-preview" class="btn ghost" href="/shop/collections" target="_blank" rel="noopener">View storefront</a><button type="button" id="cm-reload" class="btn ghost">Discard edits</button><button type="submit" id="cm-save" class="btn primary">Save collection</button></div></div><section class="cm-hero-builder" aria-labelledby="cm-hero-heading">
<div class="cm-hero-header"><div><p class="cm-kicker">Section generator · Live design</p><h3 id="cm-hero-heading">Collection hero</h3><p class="cm-muted">Your headline and buttons stay editable. Choose art from Media Library, then preview the actual storefront section.</p></div><div class="cm-header-actions"><button class="btn ghost" id="cm-hero-export" type="button">Copy section config</button><button class="btn ghost" id="cm-hero-preset" type="button">Diesel Driven preset</button></div></div>
<div id="cm-hero-preview" class="cm-hero-preview" aria-label="Live storefront hero preview"></div>
<div class="cm-hero-inspector">
<fieldset><legend>Message &amp; links</legend>
<label>Eyebrow<input id="hero-eyebrow" maxlength="100" placeholder="Fuel &amp; Free Time"></label>
<label>Headline<input id="hero-headline" maxlength="160" placeholder="Diesel Driven"></label>
<label>Supporting line<textarea id="hero-subheadline" maxlength="500" rows="2" placeholder="Built for the long haul."></textarea></label>
<div class="cm-hero-pair"><label>Primary button<input id="hero-primary-label" maxlength="90" placeholder="Shop this collection"></label><label>Target<input id="hero-primary-href" maxlength="2048" placeholder="#collection-products"></label></div>
<div class="cm-hero-pair"><label>Secondary button<input id="hero-secondary-label" maxlength="90" placeholder="Explore the shop"></label><label>Target<input id="hero-secondary-href" maxlength="2048" placeholder="/shop"></label></div>
</fieldset>
<fieldset><legend>Art &amp; background</legend>
<div class="cm-hero-pair"><label>Artwork image URL<input id="hero-artwork-url" maxlength="2048" placeholder="Transparent logo from Media Library"></label><button id="hero-pick-artwork" class="btn ghost" type="button">Choose artwork</button></div>
<p class="cm-muted">Use the original truck/logo artwork here. Avoid artwork with the hero headline already baked into it.</p>
<div class="cm-hero-pair"><label>Background image URL<input id="hero-background-url" maxlength="2048" placeholder="/media/..."></label><button id="hero-pick-background" class="btn ghost" type="button">Choose background</button></div>
<div class="cm-hero-pair"><label>Background style<select id="hero-background-mode"><option value="gradient">Gradient</option><option value="solid">Solid</option><option value="image">Image</option></select></label><label>Focal point<select id="hero-focus"><option value="center">Center</option><option value="left">Left</option><option value="right">Right</option><option value="top">Top</option><option value="bottom">Bottom</option></select></label></div>
<div class="cm-hero-pair"><label>Base color<input type="color" id="hero-background-color" value="#090b0c"></label><label>Gradient end<input type="color" id="hero-gradient-to" value="#21140d"></label></div>
<div class="cm-hero-pair"><label>Overlay <output id="hero-overlay-value" for="hero-overlay">38%</output><input type="range" id="hero-overlay" min="0" max="90" step="5" value="38"></label><label>Artwork size <output id="hero-artwork-scale-value" for="hero-artwork-scale">94%</output><input type="range" id="hero-artwork-scale" min="30" max="120" step="5" value="94"></label></div>
</fieldset>
<fieldset class="cm-hero-display"><legend>Layout &amp; typography</legend>
<div class="cm-hero-pair"><label>Composition<select id="hero-layout"><option value="split">Text left · artwork right</option><option value="right">Artwork left · text right</option><option value="center">Centered stack</option></select></label><label>Section height<select id="hero-height"><option value="compact">Compact</option><option value="standard">Standard</option><option value="immersive">Immersive</option></select></label></div>
<label>Text color<input type="color" id="hero-text-color" value="#f5f1e8"></label>
</fieldset>
</div><p class="cm-hero-footnote">Changes preview instantly but become public only after <strong>Save collection</strong> and publication.</p>
</section><div class="cm-fields"><label>Collection title<input id="cm-title" name="title" maxlength="120" required placeholder="Diesel Driven"></label><label>URL handle<input id="cm-slug" name="slug" maxlength="180" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" required placeholder="diesel-driven"></label><label>Publication<select id="cm-status" name="status"><option value="draft">Draft — hidden from storefront</option><option value="active">Published — visible to customers</option><option value="archived">Archived — hidden and retained</option></select></label><label>Order<input id="cm-sort" name="sort_order" type="number" min="0" max="100000" step="1" value="0"></label><label class="cm-wide">Description<textarea id="cm-description" name="description" rows="3" maxlength="6000" placeholder="Tell customers what connects these products"></textarea></label><label>Eyebrow / short label<input id="cm-eyebrow" maxlength="120" name="eyebrow" placeholder="Built for the long haul"></label><label>Accent color<input id="cm-accent" name="accent_color" type="color" value="#ff4d00"></label><label class="cm-wide">Collection image URL<input id="cm-image" name="image_url" maxlength="2000" placeholder="/assets/... or https://..." autocomplete="off"><span class="cm-image-actions"><button type="button" id="cm-browse-media" class="btn ghost">Browse media library</button><a href="/admin/content" target="_blank" rel="noopener">Open library</a></span><img id="cm-cover-preview" alt="Selected collection cover" hidden><small>Choose one image from the existing R2 library, or paste a direct image URL.</small></label><label>SEO page title<input id="cm-seo-title" name="seo_title" maxlength="180" placeholder="Optional custom search title"></label><label>SEO description<textarea id="cm-seo-description" name="seo_description" maxlength="400" rows="2" placeholder="Optional search description"></textarea></label></div><section class="cm-lineup-builder" aria-labelledby="cm-lineup-title">
<div class="cm-lineup-header"><div><p class="cm-kicker">Merch collection builder</p><h3 id="cm-lineup-title">Build your product lineup</h3><p class="cm-muted">Start with a suggested set or browse real supplier blanks, add artwork in Product Studio, and bring the products into this collection automatically.</p></div><a href="/admin/products/create" id="cm-open-studio" class="btn ghost">Browse all supplier products</a></div>
<div class="cm-lineup-presets" role="group" aria-label="Suggested product sets">
<button class="cm-lineup-preset" type="button" data-kit="diesel"><strong>Diesel Essentials</strong><span>Heavy tee · sweatshirt · hoodie</span></button>
<button class="cm-lineup-preset" type="button" data-kit="weekend"><strong>Weekend Gear</strong><span>Everyday tee · cap · long sleeve</span></button>
<button class="cm-lineup-preset" type="button" data-kit="core"><strong>Brand Staples</strong><span>Premium tee · fleece · outer layer</span></button>
</div>
<div class="cm-lineup-tools"><label>Find a supplier blank<input type="search" id="cm-supplier-search" placeholder="Search the actual Completeful catalog"></label><button class="btn ghost" id="cm-search-supplier" type="button">Find blanks</button></div>
<div id="cm-supplier-status" class="cm-muted" role="status" aria-live="polite"></div>
<div id="cm-supplier-results" class="cm-supplier-grid"></div>
<div class="cm-lineup-selected"><div><strong>Planned products <span id="cm-lineup-count">0</span></strong><p class="cm-muted">A planned blank is not yet a manufactured or published product.</p></div><div id="cm-planned-results" class="cm-planned-results"></div></div>
</section><section class="cm-products-section"><div class="cm-products-head"><div><h3>Products in this collection <span id="cm-selected-count">0</span></h3><p class="cm-muted">Choose existing catalog items. Product publish status is managed separately.</p></div><button type="button" id="cm-save-members" class="btn primary">Save product assignments</button></div><div class="cm-product-tools"><label for="cm-product-search">Find products</label><input id="cm-product-search" type="search" placeholder="Search product title or handle"><label class="cm-check"><input type="checkbox" id="cm-selected-only"> Selected only</label></div><div id="cm-product-list" class="cm-product-list" role="group" aria-label="Assign products"><p class="cm-muted">Loading products…</p></div></section></form></section></div></main>');
</script>
<script defer src="/admin/js/merch-hero.js"></script>\n<script defer src="/admin/js/collection-manager.js"></script>
</body>
</html>
