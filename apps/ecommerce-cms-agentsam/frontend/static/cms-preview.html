<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Private CMS draft preview — AgentSam</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;color:#27333a;background:#f1f3f4}
  .draft-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:8px 18px;background:#fff;border-bottom:1px solid #dbe0e3}
  .draft-bar strong{font-size:13px}.draft-bar span{color:#737f88;font-size:12px}.draft-bar a{font-size:12px;color:#4759a0;text-decoration:none;font-weight:700}
  .draft-details{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .draft-pill{background:#fff1d8;color:#755013;border-radius:99px;padding:5px 9px;font-size:10px;font-weight:750}
  .draft-stage{height:calc(100dvh - 52px)}iframe{display:block;width:100%;height:100%;border:0;background:#fff}
  .draft-error{padding:40px;max-width:680px;margin:auto}.draft-error p{line-height:1.55}
  @media(max-width:640px){.draft-bar{padding:8px 12px}.draft-bar span{display:none}}
</style></head>
<body>
  <header class="draft-bar"><div class="draft-details"><span class="draft-pill">PRIVATE DRAFT</span><strong id="page-name">Loading preview…</strong><span id="theme-name"></span></div><a id="editor-link" href="/admin/theme-editor">Edit this page</a></header>
  <main class="draft-stage"><iframe id="draft-frame" title="Private CMS draft preview"></iframe></main>
  <script src="/admin/js/theme-preview-registry.js"></script>
  <script src="/admin/js/portable-sections.js"></script>
  <script src="/admin/js/revise-atlas.js"></script>
  <script src="/admin/js/theme-preview-runtime.js"></script>
  <script type="module" src="/admin/js/cms-private-preview.js"></script>
</body></html>
