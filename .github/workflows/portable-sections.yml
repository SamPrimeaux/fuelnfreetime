name: Portable theme sections
on:
  pull_request:
    paths:
      - packages/theme-contract/runtime/portable-sections.*
      - packages/fnf-theme/src/editor/preview-adapter.js
      - packages/heuristic-theme/storefront/js/cms-hydrate.js
      - packages/heuristic-theme/storefront/js/page-composer.js
      - apps/ecommerce-cms-agentsam/frontend/static/js/theme-editor.js
      - apps/ecommerce-cms-agentsam/frontend/static/css/theme-editor.css
      - tests/storefront-header-presets-editor.test.mjs
      - apps/ecommerce-cms-agentsam/backend/cms/api.js
      - apps/ecommerce-cms-agentsam/backend/cms/page-authority.js
      - packages/theme-contract/runtime/revise-atlas-*
      - apps/ecommerce-cms-agentsam/fixtures/fnf-revise-site.json
      - apps/ecommerce-cms-agentsam/frontend/static/revise-atlas.html
      - apps/ecommerce-cms-agentsam/frontend/static/scene-lab.html
      - apps/ecommerce-cms-agentsam/frontend/static/js/revise-atlas-view.js
      - tests/revise-atlas-contract.test.mjs
      - tests/revise-atlas-browser-smoke.mjs
      - tests/revise-atlas-storefront-browser-smoke.mjs
      - scripts/harvest-revise-site.mjs
      - README.md
      - AGENTS.md
      - docs/package-authority.json
      - docs/ARCHITECTURE-AUTHORITY.md
      - docs/generated/package-authority.md
      - scripts/package-authority.mjs
      - packages/**/package.json
      - apps/ecommerce-cms-agentsam/package.json
      - package.json
      - package-lock.json
      - apps/ecommerce-cms-agentsam/frontend/static/pages.html
      - packages/heuristic-theme/storefront/shop.html
      - tests/cms-live-source-browser-smoke.mjs
      - tests/cms-generated-section-accept.test.mjs
      - tests/cms-generated-stream.test.mjs
      - tests/cms-generated-storefront-browser-smoke.mjs
      - tests/cms-generated-approval-browser-smoke.mjs
      - apps/ecommerce-cms-agentsam/frontend/static/js/agentsam.js
      - apps/ecommerce-cms-agentsam/frontend/static/js/agentsam-composer.js
      - apps/ecommerce-cms-agentsam/frontend/static/js/miniagentsam-codepreview.js
      - apps/ecommerce-cms-agentsam/frontend/static/css/agentsam.css
      - apps/ecommerce-cms-agentsam/frontend/static/brand/agentsam-mark.svg
      - apps/ecommerce-cms-agentsam/tests/reference-fidelity-dom.test.mjs
      - docs/ui-reference/agentsam-side-assistant/**
      - apps/ecommerce-cms-agentsam/AGENTS.md
      - apps/ecommerce-cms-agentsam/backend/cms/generated-section.mjs
      - apps/ecommerce-cms-agentsam/backend/cms/definition-registry.mjs
      - apps/ecommerce-cms-agentsam/frontend/static/js/generation-surfaces.mjs
      - apps/ecommerce-cms-agentsam/frontend/static/js/theme-editor-generation-bootstrap.mjs
      - apps/ecommerce-cms-agentsam/frontend/static/js/generation-stream.mjs
      - tests/cms-slot-binding-browser-smoke.mjs
      - tests/cms-legacy-field-style-browser-smoke.mjs
      - apps/ecommerce-cms-agentsam/tests/theme-toolbar-behavior.test.mjs
      - scripts/sync-app-frontend.mjs
      - tests/portable-sections.test.mjs
      - tests/cms-editor-mutations.test.mjs
      - tests/portable-sections-browser-smoke.mjs
      - tests/portable-home-composer-browser-smoke.mjs
      - tests/launch/portable-editor-browser-smoke.mjs
      - tests/theme-studio-universal.test.mjs
      - .github/workflows/portable-sections.yml
permissions:
  contents: read
jobs:
  section-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked runtime and renderer packages
        run: npm ci --ignore-scripts
      - name: Verify architecture authority, package inventory and legacy paths
        run: npm run check:authority
      - name: Verify syntax
        run: |
          node --check packages/theme-contract/runtime/portable-sections.js
          node --check packages/heuristic-theme/storefront/js/cms-hydrate.js
          node --check packages/heuristic-theme/storefront/js/page-composer.js
          node --check packages/fnf-theme/src/editor/preview-adapter.js
          node --check apps/ecommerce-cms-agentsam/backend/cms/api.js
          node --check apps/ecommerce-cms-agentsam/backend/cms/generated-section.mjs
          node --check apps/ecommerce-cms-agentsam/frontend/static/js/theme-editor-generation-bootstrap.mjs
          node --check apps/ecommerce-cms-agentsam/frontend/static/js/generation-surfaces.mjs
          node --check apps/ecommerce-cms-agentsam/frontend/static/js/agentsam.js
          node --check apps/ecommerce-cms-agentsam/frontend/static/js/agentsam-composer.js
          node --check apps/ecommerce-cms-agentsam/frontend/static/js/miniagentsam-codepreview.js
          node --check apps/ecommerce-cms-agentsam/frontend/static/js/theme-editor.js
      - name: Real renderer and shared catalog checks
        run: node --test tests/portable-sections.test.mjs tests/revise-atlas-contract.test.mjs tests/theme-studio-universal.test.mjs tests/cms-editor-mutations.test.mjs tests/cms-generated-section-accept.test.mjs tests/cms-generated-stream.test.mjs tests/cms-definition-registry.test.mjs tests/storefront-header-presets-editor.test.mjs
      - name: Actual Chrome public DOM and live editor preview proof
        run: node tests/portable-sections-browser-smoke.mjs
      - name: Real Home-page composer browser proof
        run: node tests/portable-home-composer-browser-smoke.mjs
      - name: Real editor preview browser proof
        run: node tests/launch/portable-editor-browser-smoke.mjs
      - name: Real live Shop content and safe CMS draft import in Chrome
        run: node tests/cms-live-source-browser-smoke.mjs
      - name: Actual storefront media and CTA edits in Chrome
        run: node tests/cms-slot-binding-browser-smoke.mjs
      - name: Merchant legacy Hero overrides and reset preserve authored HTML and CSS
        run: node tests/cms-legacy-field-style-browser-smoke.mjs
      - name: Selected legacy field inspector saves overrides and resets in canonical CMS draft
        run: node --test apps/ecommerce-cms-agentsam/tests/theme-toolbar-behavior.test.mjs
      - name: Reference-fidelity Chrome handoff and explicit private section acceptance
        run: node tests/cms-generated-approval-browser-smoke.mjs
      - name: Accepted generated section in the actual public and private storefront renderer
        run: node tests/cms-generated-storefront-browser-smoke.mjs
      - name: Build admin and assemble public storefront assets
        run: npm run build:admin
      - name: Original Revise Atlas Chrome preview and real CMS draft contract
        run: node tests/revise-atlas-browser-smoke.mjs
      - name: Real Heuristic storefront lazily hosts genuine Revise sections
        run: node tests/revise-atlas-storefront-browser-smoke.mjs
