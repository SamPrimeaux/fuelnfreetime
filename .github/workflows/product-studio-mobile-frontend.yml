name: Mobile Product Studio frontend build
on:
  pull_request:
    paths:
      - 'apps/ecommerce-cms-agentsam/frontend/src/pages/products/**'
      - 'apps/ecommerce-cms-agentsam/frontend/src/styles/product-studio.css'
      - 'apps/ecommerce-cms-agentsam/frontend/package*.json'
      - '.github/workflows/product-studio-mobile-frontend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/ecommerce-cms-agentsam/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix apps/ecommerce-cms-agentsam/frontend
      - name: Typecheck and build the Product Studio frontend
        run: npm run build --prefix apps/ecommerce-cms-agentsam/frontend
      - name: Install repository artwork processing dependencies
        run: npm ci
      - name: Test real R2 artwork repair, safety and manufacturing quality statuses
        run: node --test tests/artwork-production-repair.test.mjs
