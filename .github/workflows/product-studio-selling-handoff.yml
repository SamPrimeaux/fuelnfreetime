name: Product Studio selling selection handoff
on:
  pull_request:
    paths:
      - 'apps/ecommerce-cms-agentsam/backend/admin/api.js'
      - 'apps/ecommerce-cms-agentsam/backend/admin/product-selling-selection.js'
      - 'apps/ecommerce-cms-agentsam/frontend/static/product-edit.html'
      - 'apps/ecommerce-cms-agentsam/frontend/static/css/product-edit.css'
      - 'tests/product-studio-selling-handoff.test.mjs'
      - 'tests/product-edit-inline-syntax.test.mjs'
      - 'tests/product-workflow-next-step.test.mjs'
      - '.github/workflows/product-studio-selling-handoff.yml'
permissions:
  contents: read
jobs:
  supplier-selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual saved supplier variant handoff
        run: node --test tests/product-studio-selling-handoff.test.mjs tests/product-edit-inline-syntax.test.mjs tests/product-workflow-next-step.test.mjs
      - name: Parse production backend read model
        run: node --check apps/ecommerce-cms-agentsam/backend/admin/api.js && node --check apps/ecommerce-cms-agentsam/backend/admin/product-selling-selection.js
