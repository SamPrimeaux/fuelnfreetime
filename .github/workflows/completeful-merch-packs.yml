name: Completeful publishing and collection pack contracts
on:
  pull_request:
    paths:
      - apps/ecommerce-cms-agentsam/backend/admin/product-studio.js
      - apps/ecommerce-cms-agentsam/backend/completeful/mockup-renderer.js
      - apps/ecommerce-cms-agentsam/frontend/static/product-edit.html
      - apps/ecommerce-cms-agentsam/frontend/src/pages/products/StudioWorkspace.tsx
      - apps/ecommerce-cms-agentsam/frontend/src/pages/collections/**
      - packages/agentsam-merch/src/collection-planning.*
      - tests/completeful-publish-reconcile.test.mjs
      - tests/collection-planning-sdk.test.mjs
      - .github/workflows/completeful-merch-packs.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate supplier and catalog pack regression tests
        run: |
          node --test tests/completeful-publish-reconcile.test.mjs tests/collection-planning-sdk.test.mjs
          node --test apps/ecommerce-cms-agentsam/tests/completeful-mockup-matrix.test.mjs
          node --test tests/product-studio-selling-handoff.test.mjs
      - name: Install build dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix apps/ecommerce-cms-agentsam --ignore-scripts
      - name: Build actual admin UI
        run: npm run build:admin
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir /tmp/fnf-completeful-build
