name: Media processing and Worker WASM recovery
on:
  pull_request:
    paths:
      - apps/ecommerce-cms-agentsam/backend/assets/**
      - apps/ecommerce-cms-agentsam/backend/admin/media.js
      - apps/ecommerce-cms-agentsam/frontend/static/content.html
      - apps/ecommerce-cms-agentsam/frontend/static/js/media-library.js
      - tests/media-job-collision-recovery.test.mjs
      - .github/workflows/media-worker-recovery.yml
permissions:
  contents: read
jobs:
  media-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Media queue collision and metadata regression
        run: node --test tests/media-job-collision-recovery.test.mjs
      - name: Install Worker and frontend build dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix apps/ecommerce-cms-agentsam --ignore-scripts
      - name: Build existing admin surface
        run: npm run build:admin
      - name: Bundle Worker codecs as precompiled WASM (no deployment)
        run: npx wrangler deploy --dry-run --outdir /tmp/fnf-media-worker-check
